{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
<style>
.dashboard-cards {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  margin-bottom: 25px;
  justify-content: flex-start; /* Aligne les cartes à gauche */
}
.dashboard-card {
  flex: 0 0 200px; /* Cartes plus petites */
  background: #f5f5f5;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  text-align: center;
  transition: transform 0.15s;
}
.dashboard-card:hover {
  transform: translateY(-3px);
}
.dashboard-card h3 {
  margin: 0 0 8px;
  font-size: 14px;
  color: #555;
}
.dashboard-card p {
  font-size: 22px;
  margin: 0;
  font-weight: bold;
  color: #222;
}
canvas {
  max-width: 70%;
  height: 400px !important;
}
</style>

<h1>Tableau de bord</h1>

<div class="dashboard-cards">
  <div class="dashboard-card" style="background:#4CAF50; color:white;">
    <h3>Total Clients</h3>
    <p>{{ total_clients }}</p>
  </div>
  <div class="dashboard-card" style="background:#2196F3; color:white;">
    <h3>Total Produits</h3>
    <p>{{ total_produits }}</p>
  </div>
  <div class="dashboard-card" style="background:#FF9800; color:white;">
    <h3>Total Commandes</h3>
    <p>{{ total_commandes }}</p>
  </div>
</div>

<h2>Commandes par statut</h2>
<canvas id="commandesChart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const ctx = document.getElementById('commandesChart').getContext('2d');
const data = {
    labels: [{% for c in commandes_par_statut %}'{{ c.statut }}',{% endfor %}],
    datasets: [{
        label: 'Commandes par statut',
        data: [{% for c in commandes_par_statut %}{{ c.count }},{% endfor %}],
        backgroundColor: [
          'rgba(54, 162, 235, 0.7)',
          'rgba(255, 99, 132, 0.7)',
          'rgba(255, 206, 86, 0.7)',
          'rgba(75, 192, 192, 0.7)'
        ],
        borderColor: [
          'rgba(54, 162, 235, 1)',
          'rgba(255, 99, 132, 1)',
          'rgba(255, 206, 86, 1)',
          'rgba(75, 192, 192, 1)'
        ],
        borderWidth: 1
    }]
};
new Chart(ctx, { type: 'bar', data: data, options: { responsive: true } });
</script>

{% endblock %}
